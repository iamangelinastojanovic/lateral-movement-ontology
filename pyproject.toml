[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmo"
version = "0.5.0"
description = "Lateral Movement Ontology - a security ontology over the LANL 2015 dataset"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]

[tool.setuptools.package-data]
lmo = ["web/static/*"]

[project.scripts]
lmo = "lmo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
